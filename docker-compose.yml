services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: invoiceflow
      POSTGRES_USER: invoiceflow
      POSTGRES_PASSWORD: invoiceflow
    ports:
      - "5432:5432"
    volumes:
      - invoiceflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoiceflow -d invoiceflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://invoiceflow:invoiceflow@db:5432/invoiceflow
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      GENERIC_TIMEZONE: Europe/Madrid
      TZ: Europe/Madrid
    volumes:
      - invoiceflow-n8n:/home/node/.n8n
    depends_on:
      - api

volumes:
  invoiceflow-db:
  invoiceflow-n8n:
